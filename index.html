<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>파렛트 하차 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#5b84ee;--soft:#eaf0fd;--bg:#f4f6fb;--ink:#2d3748;--line:#edf0f6;--mut:#8b96a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Noto Sans KR",-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
header{padding:20px 20px 4px;font-size:22px;font-weight:700}
main{padding:12px 14px;max-width:820px;margin:auto}
.card{background:#fff;border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(60,80,120,.05)}
h3{margin:14px 4px 10px;font-size:14px;font-weight:700;color:var(--mut)}
.card h3{margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input,select{font:inherit;color:inherit}
.chip{border:0;background:var(--bg);border-radius:999px;padding:10px 17px;font-weight:500;cursor:pointer;transition:transform .1s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--p);color:#fff}
.chip.sm{padding:6px 11px;font-size:13px;background:#fdeaea;color:#e06666}
.go{width:100%;padding:16px;border:0;border-radius:22px;background:var(--p);color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 14px rgba(91,132,238,.25);cursor:pointer}
.go.off{background:#c9d3e6;box-shadow:none}
input[type=date],input[type=text],input[type=number],select{border:0;border-radius:12px;padding:9px 12px;background:var(--bg);max-width:100%}
.sc{overflow-x:auto;border-radius:20px;background:#fff}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--soft);color:var(--p);font-size:13px;font-weight:700;position:sticky;top:0}
td:first-child,th:first-child{position:sticky;left:0;z-index:1}
td:first-child{background:#fff;font-weight:700}
th:first-child{background:var(--soft)}
tfoot td{background:var(--soft);color:var(--p);font-weight:700;border-bottom:0}
.fit table{table-layout:fixed}
.fit th,.fit td{padding:8px 3px}
.fit th:nth-child(1){width:33%}.fit th:nth-child(2){width:27%}.fit th:nth-child(3){width:22%}.fit th:nth-child(4){width:18%}
.fit input,.fit select{width:100%;min-width:0;padding:8px 5px;font-size:14px;text-align:center;text-align-last:center}
.fit td:first-child{font-weight:500}
td input{width:100%;min-width:0}
.tall{max-height:340px;overflow:auto}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi div{border-radius:20px;padding:12px 14px}
.kpi span{display:block;font-size:12px}
.kpi b{display:block;font-size:26px;font-weight:700;line-height:1.3}
.k1{background:#e8effd;color:#4a73e0}.k2{background:#e3f5ee;color:#2e9a73}.k3{background:#fdf3d8;color:#c28f12}
nav{z-index:50;position:fixed;left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:520px;margin:auto;display:flex;gap:4px;padding:6px;background:#fff;border-radius:999px;box-shadow:0 4px 18px rgba(60,80,120,.14)}
nav button{flex:1;border:0;border-radius:999px;background:none;padding:12px 4px;font-size:13px;font-weight:500;color:var(--mut)}
nav button.on{background:var(--soft);color:var(--p);font-weight:700}
#toast{z-index:60;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;display:none;white-space:nowrap}
#toast.bad{background:#d95c5c}
.mut{color:var(--mut);font-size:13px;font-weight:400}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<header>파렛트 하차 관리</header><main id="v"></main>
<nav id="nav"></nav><div id="toast"></div>
<script>
const SEED=[["2026-08-20","공판장",1,"5303"],["2026-08-20","농부",1,"5303"],["2026-08-20","싱싱야채",1,"6245"],["2026-08-20","신선",1,"5370"],["2026-08-20","참농",1,"5370"],["2026-08-21","신선",1,"6210"],["2026-08-21","참농",1,"6210"],["2026-08-21","농부",1,"5303"],["2026-08-24","공판장",1,"5303"],["2026-08-24","농부",1,"5303"],["2026-08-24","싱싱야채",1,"수철"],["2026-08-24","신선",1,"동신"],["2026-08-24","참농",1,"동신"],["2026-08-25","신선",1,"5370"],["2026-08-25","참농",1,"5370"],["2026-08-25","농부",1,"5303"],["2026-08-25","싱싱야채",1,"6245"],["2026-08-26","공판장",1,"5303"],["2026-08-26","농부",1,"5303"],["2026-08-26","신선",2,"5370"],["2026-08-26","참농",1,"5370"],["2026-08-27","공판장",1,"5303"],["2026-08-27","농부",1,"5303"],["2026-08-27","신선",1,"6210"],["2026-08-27","참농",1,"6210"],["2026-08-27","싱싱야채",1,"9652"],["2026-08-28","공판장",1,"5303"],["2026-08-28","농부",1,"5303"],["2026-08-28","신선",1,"6210"],["2026-08-28","참농",1,"6210"],["2026-08-28","유성",1,"9652"],["2026-08-31","신선",1,"6245"],["2026-08-31","참농",1,"6245"],["2026-08-31","농부",1,"5303"],["2026-08-31","유드림",1,"5303"],["2026-09-02","공판장",1,"5303"],["2026-09-02","농부",1,"5303"],["2026-09-02","참농",1,"6245"],["2026-09-02","신선",1,"6245"],["2026-09-02","싱싱야채",1,"6210"],["","신선",22,""],["","농부",19,""],["","참농",17,""],["","싱싱야채",15,""],["","공판장",2,""],["","유성",2,""],["","유드림",1,""]];
const K='pl_ledger_v1',$=s=>document.querySelector(s);
let R;try{R=JSON.parse(localStorage.getItem(K))}catch(e){}
const seed=()=>SEED.map((a,i)=>({id:i+1,d:a[0],n:a[1],q:a[2],c:a[3]}));
if(!Array.isArray(R))R=seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(R))}catch(e){}};
const nid=()=>Math.max(0,...R.map(r=>r.id))+1;
const iso=o=>new Date(Date.now()+o*864e5-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const f=x=>Math.round(x*100)/100;
const S={tab:0,view:0,date:iso(0),nd:false,sel:new Set(),q:1,c:'',mode:'merge'};
const toast=(m,bad)=>{const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',1800)};
const sums=()=>{const m={};R.forEach(r=>m[r.n]=(m[r.n]||0)+r.q);return m};
const dests=()=>{const m=sums();['신선','참농','농부','싱싱야채','공판장','유드림','유성'].forEach(n=>m[n]=m[n]||0);return Object.keys(m).sort((a,b)=>m[b]-m[a])};
const chip=(t,on,a,x='')=>`<button class="chip${on?' on':''}${x}" ${a}>${t}</button>`;
const tbl=(h,b,ft,cls='')=>`<div class="sc ${cls}"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${b}</tbody>${ft?`<tfoot>${ft}</tfoot>`:''}</table></div>`;
const tr=a=>`<tr>${a.map(x=>`<td>${x}</td>`).join('')}</tr>`;

function input(){
  const list=R.filter(r=>S.nd?!r.d:r.d===S.date);
  return `<div class="card"><h3>날짜</h3><div class="row">
  ${chip('오늘',!S.nd&&S.date===iso(0),'data-d="0"')}${chip('어제',!S.nd&&S.date===iso(-1),'data-d="-1"')}${chip('그제',!S.nd&&S.date===iso(-2),'data-d="-2"')}
  ${chip('날짜없음(KPP)',S.nd,'data-nd="1"')}<input type="date" id="dt" value="${S.date}"></div></div>
  <div class="card"><h3>하차지 <span class="mut">· 여러 곳 선택 가능</span></h3><div class="row">
  ${dests().map(n=>chip(n,S.sel.has(n),`data-n="${n}"`)).join('')}${chip('+ 추가',0,'data-add="1"')}</div></div>
  <div class="card"><h3>수량 <span class="mut">· 하차지마다 적용</span></h3><div class="row">
  ${[1,2,3,4,5,6,8,10].map(n=>chip(n,S.q===n,`data-q="${n}"`)).join('')}${chip('직접',![1,2,3,4,5,6,8,10].includes(S.q),'data-qq="1"')}</div></div>
  <button class="go${S.sel.size?'':' off'}" id="sv">저장하기${S.sel.size?' · '+[...S.sel].join(', ')+' '+S.q+'pl':''}</button>
  <h3 style="margin:16px 0 8px">${S.nd?'날짜없음(KPP) 등록분':S.date+' 등록분'}</h3>
  ${list.length?tbl(['하차지','수량','삭제'],list.map(r=>tr([r.n,f(r.q)+'pl',`<button class="chip sm" data-del="${r.id}">삭제</button>`])).join('')):'<p class="mut">아직 등록한 내역이 없어요.</p>'}`;
}

function edit(){
  const days=[iso(-2),iso(-1),iso(0)],L={[iso(0)]:'오늘',[iso(-1)]:'어제',[iso(-2)]:'그저께'};
  const rs=R.filter(r=>days.includes(r.d)).sort((a,b)=>a.d.localeCompare(b.d));
  const opt=v=>days.map(d=>`<option value="${d}"${d===v?' selected':''}>${L[d]} ${+d.slice(5,7)}/${+d.slice(8)}</option>`).join('');
  return `<h3>일별 하차지 수정 <span class="mut">· 그저께·어제·오늘</span></h3>`+(rs.length?
  tbl(['날짜','하차지','수량',''],rs.map(r=>`<tr data-id="${r.id}"><td><select data-k="d">${opt(r.d)}</select></td><td><input type="text" data-k="n" value="${r.n}"></td><td><input type="number" step="0.5" data-k="q" value="${r.q}"></td><td><button class="chip sm" data-del="${r.id}">✕</button></td></tr>`).join(''),'','fit'):'<p class="mut" style="margin:0 6px">최근 3일 입력 내역이 없어요.</p>');
}
function nb(){
  const dm={},bm={};R.forEach(r=>{const o=r.d?dm:bm;o[r.n]=(o[r.n]||0)+r.q});
  return `<h3 style="margin-top:20px">누적본 수정·추가 <span class="mut">· 날짜 없는 누적분</span></h3>`+
  tbl(['하차지','누적분','일자별','합계'],dests().map(n=>`<tr><td>${n}</td><td><input type="number" step="0.5" data-nb="${n}" value="${f(bm[n]||0)}"></td><td>${f(dm[n]||0)}</td><td><b>${f((bm[n]||0)+(dm[n]||0))}</b></td></tr>`).join(''),'','fit')+
  `<div style="margin-top:10px"><button class="chip" data-nbadd="1">+ 누적본 추가</button></div>`;
}
const refresh=()=>{if($('#sm')){$('#nb').innerHTML=nb();$('#sm').innerHTML=summary()}};
const stats=()=>edit()+'<div id="nb">'+nb()+'</div><div id="sm" style="margin-top:20px">'+summary()+'</div>';
function summary(){
  const m=sums(),ds=dests(),dated=R.filter(r=>r.d),all=R.reduce((a,r)=>a+r.q,0),dq=dated.reduce((a,r)=>a+r.q,0);
  let h=`<div class="kpi"><div class="k1"><span>전체 누적</span><b>${f(all)}</b></div><div class="k2"><span>일자별</span><b>${f(dq)}</b></div><div class="k3"><span>KPP</span><b>${f(all-dq)}</b></div></div>
  <div class="row" style="margin-bottom:12px">${chip('전체 누적',!S.view,'data-v="0"')}${chip('하차지별 일별',S.view,'data-v="1"')}</div>`;
  if(!S.view){
    const dm={};dated.forEach(r=>dm[r.n]=(dm[r.n]||0)+r.q);
    h+=tbl(['하차지','일자별','KPP','누적'],ds.map(n=>tr([n,f(dm[n]||0),f(m[n]-(dm[n]||0)),`<b>${f(m[n])}</b>`])).join(''),
      tr(['합계',f(dq),f(all-dq),f(all)]));
  }else{
    const dts=[...new Set(dated.map(r=>r.d))].sort(),g={};
    R.forEach(r=>{const k=(r.d||'KPP')+'|'+r.n;g[k]=(g[k]||0)+r.q});
    const row=(d,l)=>{const t=ds.reduce((a,n)=>a+(g[d+'|'+n]||0),0);return tr([l,...ds.map(n=>g[d+'|'+n]?f(g[d+'|'+n]):'·'),`<b>${f(t)}</b>`])};
    h+=tbl(['날짜',...ds,'합계'],dts.map(d=>row(d,d.slice(5))).join('')+row('KPP','KPP(무일자)'),tr(['누적',...ds.map(n=>f(m[n])),f(all)]));
  }
  return h;
}

function admin(){
  return `<div class="card"><h3>CSV·엑셀 업로드 <span class="mut">· 날짜, 도착지, 수량, 차량번호</span></h3>
  <div class="row" style="margin-bottom:10px">${chip('날짜 덮어쓰기',S.mode=='merge','data-m="merge"')}${chip('전체 교체',S.mode=='replace','data-m="replace"')}${chip('기존에 추가',S.mode=='add','data-m="add"')}</div>
  <input type="file" id="up" accept=".csv,.xlsx,.xls"><p class="mut">날짜 덮어쓰기: 파일에 있는 날짜의 기존 데이터만 교체합니다(일별 수정용). 도착지가 "신선,참농"처럼 여러 곳이면 수량을 균등하게 나눠 개별 등록합니다. 날짜가 비어 있으면 KPP 누적분으로 들어갑니다.</p></div>
  <div class="card"><h3>백업</h3><div class="row">
  <button class="chip" id="ecsv">CSV 내보내기</button><button class="chip" id="exls">엑셀 내보내기</button><button class="chip" id="ejson">JSON 백업</button>
  <label class="chip">JSON 복원<input type="file" id="rjson" accept=".json" hidden></label>
  <button class="chip" id="rst">초기 데이터로 되돌리기</button></div>
  <p class="mut">데이터는 이 기기의 브라우저에 저장됩니다. 정기적으로 백업하세요.</p></div>`;
}

function render(){
  $('#v').innerHTML=[input,stats,admin][S.tab]();
  $('#nav').innerHTML=['일별 하차지 입력','누적현황','관리'].map((t,i)=>`<button class="${S.tab==i?'on':''}" data-t="${i}">${t}</button>`).join('');
}
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
function parse(t){const o=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];
  if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}
  else if(h=='"')q=1;else if(h==','){r.push(c);c=''}
  else if(h=='\n'||h=='\r'){if(h=='\r'&&t[i+1]=='\n')i++;r.push(c);o.push(r);r=[];c=''}else c+=h}
  if(c||r.length){r.push(c);o.push(r)}return o}
function imp(rows){
  rows=rows.map(r=>r.map(x=>String(x==null?'':x).trim())).filter(r=>r.some(Boolean));
  let ix=[0,1,2,3];
  if(rows.length&&/날짜|도착지|하차지|수량/.test(rows[0].join())){const hd=rows.shift(),g=re=>hd.findIndex(x=>re.test(x));ix=[g(/날짜/),g(/도착지|하차지/),g(/수량/),g(/차량/)]}
  const out=[];let id=S.mode=='replace'?1:nid();
  rows.forEach(r=>{const v=i=>i<0?'':r[i]||'';const m=v(ix[0]).match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    const d=m?`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`:'';
    const ns=v(ix[1]).split(/[,+\/]/).map(x=>x.trim()).filter(Boolean),q=parseFloat(v(ix[2]).replace(/[^\d.]/g,''))||0;
    ns.forEach(n=>out.push({id:id++,d,n,q:f(q/ns.length),c:v(ix[3])}))});
  if(S.mode=='replace')R=out;else{if(S.mode=='merge'){const ks=new Set(out.map(o=>o.d));R=R.filter(r=>!ks.has(r.d))}R=R.concat(out)}
  save();toast(out.length+'건 반영');render()}

document.addEventListener('click',e=>{
  const b=e.target.closest('button,label');if(!b)return;const d=b.dataset;
  if(d.t!==undefined){S.tab=+d.t}
  else if(d.d!==undefined){S.date=iso(+d.d);S.nd=false}
  else if(d.nd){S.nd=true}
  else if(d.n){S.sel.has(d.n)?S.sel.delete(d.n):S.sel.add(d.n)}
  else if(d.add){const n=(prompt('새 하차지 이름')||'').trim();if(n){S.sel.add(n);R.push({id:nid(),d:'',n,q:0,c:''});save()}}
  else if(d.q){S.q=+d.q}
  else if(d.qq){const v=parseFloat(prompt('수량(pl)',S.q));if(v>0)S.q=v}
  else if(d.nbadd){const n=(prompt('하차지 이름')||'').trim();if(!n)return;const v=parseFloat(prompt('누적분 수량(pl)','0'))||0;R.push({id:nid(),d:'',n,q:v,c:''});save();toast('추가했어요')}
  else if(d.v!==undefined){S.view=+d.v;$('#sm').innerHTML=summary();return}
  else if(d.m){S.mode=d.m}
  else if(d.del){R=R.filter(r=>r.id!=d.del);save()}
  else if(b.id=='sv'){if(!S.sel.size)return toast('하차지를 먼저 선택하세요!',1);
    S.sel.forEach(n=>R.push({id:nid(),d:S.nd?'':S.date,n,q:S.q,c:''}));S.sel.clear();save();toast('저장했어요')}
  else if(b.id=='ecsv'){const s=[...R].sort((a,b)=>(a.d||'9').localeCompare(b.d||'9'));
    dl('파레트_입출고내역서_누적.csv','\uFEFF날짜,도착지,수량,차량번호\n'+s.map(r=>[r.d,r.n,f(r.q)+'pl',r.c||''].map(x=>/[",\n]/.test(x)?`"${x.replace(/"/g,'""')}"`:x).join(',')).join('\n'),'text/csv')}
  else if(b.id=='exls'){if(typeof XLSX=='undefined')return toast('엑셀 라이브러리를 불러오지 못했어요',1);
    const s=[...R].sort((a,b)=>(a.d||'9').localeCompare(b.d||'9')),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['날짜','도착지','수량','차량번호'],...s.map(r=>[r.d,r.n,r.q,r.c||''])]),'내역');XLSX.writeFile(wb,'파렛트_누적본.xlsx')}
  else if(b.id=='ejson'){dl('파렛트_백업_'+iso(0)+'.json',JSON.stringify(R),'application/json')}
  else if(b.id=='rst'){if(confirm('모든 수정 내용이 사라지고 최초 데이터로 돌아갑니다.')){R=seed();save()}}
  else return;
  render()});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id=='dt'){S.date=t.value;S.nd=false;render()}
  else if(t.id=='up'&&t.files[0]){const fl=t.files[0];if(S.mode=='replace'&&!confirm('기존 데이터를 모두 교체합니다.')){t.value='';return}
    if(/\.xlsx?$/i.test(fl.name)){if(typeof XLSX=='undefined')return toast('엑셀 라이브러리를 불러오지 못했어요',1);
      fl.arrayBuffer().then(b=>{const w=XLSX.read(b),ws=w.Sheets[w.SheetNames[0]];imp(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:'yyyy-mm-dd',defval:''}))})}
    else fl.text().then(x=>imp(parse(x.replace(/^\uFEFF/,''))));t.value=''}
  else if(t.id=='rjson'&&t.files[0]){t.files[0].text().then(x=>{try{const a=JSON.parse(x);if(!Array.isArray(a))throw 0;R=a;save();toast('복원됨');render()}catch(_){toast('JSON 형식이 아니에요',1)}})}
  else if(t.dataset.nb!==undefined){const n=t.dataset.nb,v=parseFloat(t.value)||0;R=R.filter(r=>!(r.d===''&&r.n===n));if(v>0)R.push({id:nid(),d:'',n,q:v,c:''});save();toast('수정됨');refresh()}
  else if(t.dataset.k){const r=R.find(r=>r.id==t.closest('tr').dataset.id);r[t.dataset.k]=t.dataset.k=='q'?(parseFloat(t.value)||0):t.value;save();toast('수정됨');refresh()}});
render();
</script></body></html>
