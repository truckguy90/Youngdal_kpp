<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4c5c"><meta name="apple-mobile-web-app-capable" content="yes">
<title>파렛트 하차 관리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--p:#5b84ee;--soft:#eaf0fd;--bg:#f4f6fb;--ink:#2d3748;--line:#edf0f6;--mut:#8b96a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Noto Sans KR",-apple-system,sans-serif;padding:env(safe-area-inset-top) 0 calc(86px + env(safe-area-inset-bottom))}
header{padding:20px 20px 4px;font-size:22px;font-weight:700}
main{padding:12px 14px;max-width:820px;margin:auto}
.card{background:#fff;border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(60,80,120,.05)}
h3{margin:14px 4px 10px;font-size:14px;font-weight:700;color:var(--mut)}
.card h3{margin:0 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,input,select{font:inherit;color:inherit}
.chip{border:0;background:var(--bg);border-radius:999px;padding:10px 17px;font-weight:500;cursor:pointer;transition:transform .1s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--p);color:#fff}
.chip.sm{padding:6px 11px;font-size:13px;background:#fdeaea;color:#e06666}
.go{width:100%;padding:16px;border:0;border-radius:22px;background:var(--p);color:#fff;font-weight:700;font-size:16px;box-shadow:0 6px 14px rgba(91,132,238,.25);cursor:pointer}
.go.off{background:#c9d3e6;box-shadow:none}
input[type=date],input[type=text],input[type=number],select{border:0;border-radius:12px;padding:9px 12px;background:var(--bg);max-width:100%}
.sc{overflow-x:auto;border-radius:20px;background:#fff}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
th{background:var(--soft);color:var(--p);font-size:13px;font-weight:700;position:sticky;top:0}
td:first-child,th:first-child{position:sticky;left:0;z-index:1}
td:first-child{background:#fff;font-weight:700}
th:first-child{background:var(--soft)}
tfoot td{background:var(--soft);color:var(--p);font-weight:700;border-bottom:0}
.fit table{table-layout:fixed}
.fit th,.fit td{padding:8px 3px}
.fit th:nth-child(1){width:33%}.fit th:nth-child(2){width:27%}.fit th:nth-child(3){width:22%}.fit th:nth-child(4){width:18%}
.fit input,.fit select{width:100%;min-width:0;padding:8px 5px;font-size:14px;text-align:center;text-align-last:center}
